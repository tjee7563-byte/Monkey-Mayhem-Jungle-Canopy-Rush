<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0f281e" />
      <stop offset="100%" stopColor="#1b4d3e" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#facc15" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#facc15" stopOpacity="0" />
    </radialGradient>
    <linearGradient id="bananaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="50%" stopColor="#facc15" />
      <stop offset="100%" stopColor="#eab308" />
    </linearGradient>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow)" />

  <!-- Vine border circle -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#2d471e" stroke-width="12" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="#4ade80" stroke-width="4" stroke-dasharray="24 16" />

  <!-- Monkey Ears -->
  <circle cx="150" cy="220" r="48" fill="#92400e" />
  <circle cx="150" cy="220" r="26" fill="#fed7aa" />
  <circle cx="362" cy="220" r="48" fill="#92400e" />
  <circle cx="362" cy="220" r="26" fill="#fed7aa" />

  <!-- Monkey Head -->
  <circle cx="256" cy="256" r="120" fill="#92400e" />

  <!-- Peach Muzzle Area -->
  <ellipse cx="256" cy="296" r="74" ry="56" fill="#fed7aa" />

  <!-- Cute Nose -->
  <ellipse cx="256" cy="272" rx="16" ry="12" fill="#78350f" />

  <!-- Cheerful Smile -->
  <path d="M 230 305 Q 256 335 282 305" fill="none" stroke="#78350f" stroke-width="7" stroke-linecap="round" />

  <!-- Big Animated Eyes -->
  <circle cx="216" cy="216" r="28" fill="#ffffff" />
  <circle cx="296" cy="216" r="28" fill="#ffffff" />
  <circle cx="222" cy="216" r="16" fill="#1e1b4b" />
  <circle cx="302" cy="216" r="16" fill="#1e1b4b" />
  <circle cx="218" cy="210" r="7" fill="#ffffff" />
  <circle cx="298" cy="210" r="7" fill="#ffffff" />

  <!-- Golden Banana Crown Badge -->
  <g transform="translate(256, 110) scale(1.1)">
    <path d="M -45 10 Q 0 -35 45 10 Q 0 -15 -45 10 Z" fill="url(#bananaGrad)" stroke="#b45309" stroke-width="3" />
    <circle cx="0" cy="-6" r="5" fill="#ffffff" />
  </g>
</svg>
